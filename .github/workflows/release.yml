name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build release artifacts
        run: python scripts/release.py

      - name: Build Windows installer
        run: |
          # The amake/innosetup container runs as a non-root user (uid 1000), so it
          # cannot write the installer into artifacts/release (created by release.py as
          # the runner user). Make the output tree writable before compiling.
          chmod -R a+rwX artifacts
          docker run --rm -v "$PWD:/work" amake/innosetup /work/installer/DMap.iss "/DAppVersion=${GITHUB_REF_NAME}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog_anchor="${GITHUB_REF_NAME//./-}"
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/release/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "See the [changelog](https://campbellmbrown.github.io/dmap-net/changelog.html#${changelog_anchor})."
